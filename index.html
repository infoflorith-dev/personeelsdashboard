<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personeelsdashboard</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f9;
      padding:40px;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:12px;
      max-width:800px;
      margin:auto;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }

    h1{
      margin-top:0;
    }

    .upload{
      border:2px dashed #999;
      padding:40px;
      text-align:center;
      border-radius:10px;
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="card">

<h1>Personeelsdashboard</h1>

<p>
Upload hier straks je Excelbestand met ziekte, vakantie en overige afwezigheid.
</p>

<div class="upload">
<input type="file" id="excelFile" accept=".xls,.xlsx">
</div>

</div>

</body>
</html>
